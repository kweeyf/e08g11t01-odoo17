trigger:
  branches:
    include:
      - Staging
      - master

variables:
  repoUrl: 'https://github.com/kweeyf/e08g11t01-odoo17.git'
  stagePath: '/home/is214'
  deployPath: '/home/is214/deploy-temp'
  updateScript: '/home/is214/deploy-temp/update_code.sh'

stages:
- stage: Staging
  displayName: Deploy to Staging
  condition: eq(variables['Build.SourceBranchName'], 'Staging')
  jobs:
  - deployment: DeployStaging
    displayName: Deploy to Staging VM
    environment: Staging
    pool:
      name: Default
      demands:
        - Agent.Name -equals odoostaging-vm
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none
          - bash: |
              set -e
              echo "Deploying branch: $(Build.SourceBranchName)"
              cd "$(stagePath)"
              rm -rf "$(deployPath)"
              git clone -b Staging "$(repoUrl)" "$(deployPath)" --quiet
              cd "$(deployPath)"
              rm -f .DS_Store
              rm -rf .github
              chmod +x "$(updateScript)"
              sudo "$(updateScript)"
            displayName: Sync code and run update script - Staging

- stage: Production
  displayName: Deploy to Production
  condition: eq(variables['Build.SourceBranchName'], 'master')
  jobs:
  - deployment: DeployProduction
    displayName: Deploy to Production VM
    environment: Production
    pool:
      name: Default
      demands:
        - Agent.Name -equals odooproduction-vm
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none
          - bash: |
              set -e
              echo "Deploying branch: $(Build.SourceBranchName)"
              cd "$(stagePath)"
              rm -rf "$(deployPath)"
              git clone -b master "$(repoUrl)" "$(deployPath)" --quiet
              cd "$(deployPath)"
              rm -f .DS_Store
              rm -rf .github
              chmod +x "$(updateScript)"
              sudo "$(updateScript)"
            displayName: Sync code and run update script - Production